<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="background:#eee; padding:20px; font-family:monospace;">
  <h2>Calculadora</h2>
  <input id="a" type="number"> + <input id="b" type="number"> = <span id="r"></span>
  <button onclick="calc()">Calcular</button>
  <script>function calc(){r.innerText=+a.value + +b.value}</script>
</body>
</html>
